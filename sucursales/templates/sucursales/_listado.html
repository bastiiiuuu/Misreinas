
{% for sucursal in sucursales %}
<article class="branch{% if forloop.counter|divisibleby:2 %} branch--reverse{% endif %}">
  <div class="branch__media">


    {% if sucursal.imagen %}
    <img src="{{ sucursal.imagen.url }}" alt="Fotografía de {{ sucursal.nombre }}" loading="lazy">
    {% else %}
    <p>Imagen no disponible.</p>
    {% endif %}
  </div> 
  <div class="branch__content">
    <span class="branch__badge">Sucursal</span>
    <h2>{{ sucursal.nombre }}</h2>
    <p>{{ sucursal.direccion }}</p>
    <p>{{ sucursal.descripcion|urlize|linebreaksbr }}</p>
  </div> 
</article> 
{% empty %}
<p>Todavía no hay sucursales publicadas.</p>
{% endfor %}
